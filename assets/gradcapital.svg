<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1604 351" role="img">
  <title>gradCapital</title>
  <defs>
    <image id="source" width="1604" height="351" xlink:href="data:image/png;base64,"/>
    <clipPath id="grad"><rect width="632" height="351"/></clipPath>
    <clipPath id="capital"><rect x="632" width="972" height="351"/></clipPath>
    <filter id="ink" color-interpolation-filters="sRGB">
      <feFlood flood-color="#222"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="letters" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 .133 0 0 0 0 .133 0 0 0 0 .133 -.42 -.42 -.42 0 1.2"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <g clip-path="url(#grad)"><use xlink:href="#source" filter="url(#ink)"/></g>
  <g clip-path="url(#capital)"><use xlink:href="#source" filter="url(#letters)"/></g>
</svg>